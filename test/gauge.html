<!DOCTYPE html>
<!-- Fixture for the usage gauge. Not shipped.

     Mounts the real content/usage.js against a stubbed Thistle bridge and a
     mock of Claude's composer: editor on top, one control row underneath with
     the tool buttons left and the mic/send pair right, and the model picker
     down in the footer row outside the composer — which is where Claude moved
     it, and what broke the old single-selector anchor.

     Around that sits Claude's page shell and a sidebar that transforms it.
     Those exist for the popover rather than the gauge: a transformed ancestor
     becomes the containing block for a position:fixed descendant, which is
     what used to drag the panel away from the gauge whenever the sidebar
     opened.

     So this exercises four things at once: the ring rendering, the gauge
     landing immediately left of the microphone, the anchor holding still while
     Claude swaps send for stop and back, and the popover staying on the gauge
     across a sidebar that moves the composer under it.

     It also no longer loads content/mark.js. mark.js tagged the composer for
     the theme's stylesheet and the gauge read that tag; both are gone, and
     usage.js now finds the composer from its own geometry — so the fixture
     hands it nothing but the shape it has to measure. -->
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<!-- claude.ai sets one, and without it a phone-sized window still lays out
     at the 980px default — so usage.css's narrow-viewport rules could never
     be exercised here, which is exactly where the control is under width
     pressure. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usage gauge fixture</title>
<link rel="stylesheet" href="../content/usage.css">
<style>
  /* Declared because the popover's surface is the system Canvas/CanvasText
     pair, which follows the used color-scheme. Without this the fixture
     renders a white panel on its own black page — not what claude.ai shows,
     which inherits its own declaration. */
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #f5f5f5;
    font: 14px system-ui;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; }

  /* Claude's page shell and its sidebar.

     The shell is here because of what it does to the popover, not because the
     gauge needs it. Claude slides the conversation column with a transform
     when the sidebar opens, and a transformed ancestor becomes the containing
     block for any position:fixed descendant — so the panel, which lives inside
     the composer, stopped being positioned against the viewport and started
     being positioned against a box that had itself just moved 260px. That is
     the whole of the "popup gets pushed to the side" bug, and it cannot be
     reproduced without a real transform on a real ancestor.

     Declared only in the open state. `transform: translateX(0)` would create
     the containing block just as surely as any other value, and the closed
     case has to be genuinely untransformed for the two to differ. */
  .shell { transition: transform 0.2s ease, width 0.2s ease; }
  body[data-sidebar] .shell {
    transform: translateX(260px);
    width: calc(100% - 260px);
  }

  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 260px;
    background: #141414;
    border-right: 1px solid #262626;
    transform: translateX(-260px);
    transition: transform 0.2s ease;
  }
  body[data-sidebar] .sidebar { transform: translateX(0); }

  /* Claude's composer card: rounded, wide, editor on top and a control row
     underneath. usage.js climbs from the editor to the first wide ancestor
     that also holds a button of its own, which is this element. */
  .card {
    width: 720px;
    max-width: 100%;
    margin: 0 auto;
    border-radius: 16px;
    background: #1c1c1c;
    padding: 12px 14px;
  }
  .editor { min-height: 44px; outline: none; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 40px; flex-wrap: nowrap; }
  .row__right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* The ring animates its sweep over 0.4s and its colour over 0.16s. Reading
     a computed stroke mid-transition returns an interpolated value, so the
     warn-colour assertion would compare against a blend rather than the
     coral. Neutralised here only — the transition itself is decoration, and
     asserting on it would be flaky rather than useful. */
  .th-usage__ring-fill { transition: none !important; }
  .btn {
    height: 32px; min-width: 32px; padding: 0 10px;
    border: 0; border-radius: 8px; background: #262626; color: #b4b4b4;
    font: inherit; cursor: pointer;
  }

  /* The footer row, outside the card. The model picker lives here now. */
  .footer {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    height: 34px; font-size: 12px; color: #8a8a8a;
  }

  #out { padding: 16px 24px; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  .stage { display: flex; align-items: center; gap: 18px; padding: 8px 24px; }
  .stage button { font: inherit; }
</style>
</head>
<body>
  <div class="sidebar"></div>
  <div class="shell">
  <main>
    <div class="card">
      <div class="editor" contenteditable="true">How does this render?</div>
      <div class="row">
        <button class="btn" aria-label="Add content">+</button>
        <button class="btn">Research</button>
        <div class="row__right">
          <!-- The gauge's anchor. Given the exact testid rather than one of
               the looser aria-label forms, because that is the rung the
               cascade tries first and the one claude.ai actually ships. -->
          <button class="btn" id="mic" aria-label="Dictate button"
                  data-testid="voice-input-button">◉</button>
          <button class="btn" id="send" aria-label="Send message" data-testid="send-button">↑</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="btn" id="picker" data-testid="model-selector-dropdown"
              aria-haspopup="menu">Sonnet 5 Max</button>
      <span>Claude is AI and can make mistakes</span>
    </div>
  </main>
  </div>

  <div class="stage">
    <button id="p0">0%</button>
    <button id="p42">42%</button>
    <button id="p95">95%</button>
    <button id="pSpent">spent</button>
    <button id="pSidebar">sidebar</button>
    <button id="pGen">generating</button>
  </div>

  <pre id="out">running…</pre>

  <script>
    /* Stub only what usage.js reaches for: the bridge handshake, the poll,
       and the event subscription. No network, no page-world injection.

       Handlers are captured rather than dropped so the fixture can push
       readings through the same th:limit path claude.ai's SSE stream uses,
       which means updateBar() is exercised for real instead of reimplemented
       here. */
    globalThis.__handlers = {};
    globalThis.Thistle = {
      injectBridgeOnce: () => Promise.resolve(true),
      bridge: {
        on(name, fn) {
          (globalThis.__handlers[name] = globalThis.__handlers[name] || []).push(fn);
        },
        requestUsage: () => Promise.resolve(null),
      },
    };
    globalThis.__emit = function (name, payload) {
      for (const fn of globalThis.__handlers[name] || []) fn(payload);
    };
  </script>

  <script>
    /* Claude's composer states, reproduced as DOM swaps rather than as a class
       toggle.

       That distinction is the whole point. Submitting does not relabel the
       send button, it replaces it, and the dictation button is not guaranteed
       to survive the handover either — so there are frames in which neither
       control exists. A fixture that toggled a class would have left both in
       the DOM for the cascade to find, and would have reproduced nothing. */
    globalThis.__state = (function () {
      function make(id, label, testid, glyph) {
        const b = document.createElement("button");
        b.className = "btn";
        b.id = id;
        b.setAttribute("aria-label", label);
        if (testid) b.setAttribute("data-testid", testid);
        b.textContent = glyph;
        return b;
      }

      const build = {
        idle: () => [
          make("mic", "Dictate button", "voice-input-button", "◉"),
          make("send", "Send message", "send-button", "↑"),
        ],
        dictating: () => [
          make("mic", "Dictate button", "voice-input-button", "◉"),
          make("wave", "Submit dictation", "dictation-submit", "⦀"),
          make("send", "Send message", "send-button", "↑"),
        ],
        /* Mid-handover: send has gone, stop is not mounted yet, dictation has
           been torn down. One pass of this was all it took to fling the gauge
           into the middle of the row. */
        submitting: () => [],
        generating: () => [
          make("stop", "Stop response", "stop-button", "■"),
          make("mic", "Dictate button", "voice-input-button", "◉"),
        ],
      };

      return function (name) {
        for (const id of ["mic", "send", "stop", "wave"]) {
          const el = document.getElementById(id);
          if (el) el.remove();
        }
        /* Appended after whatever is already there, the gauge included —
           which is what a re-render does, and leaves usage.js to put the
           gauge back in front of the controls on its own. */
        const host = document.querySelector(".row__right");
        for (const node of build[name]()) host.append(node);
        return name;
      };
    })();

    globalThis.__sidebar = function (open) {
      document.body.toggleAttribute("data-sidebar", open);
    };
  </script>

  <script>
    (function () {
      function load(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src + "?t=" + Date.now() + "-" + Math.random();
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }
      load("../content/usage.js").then(function () { return load("gauge-assert.js"); });
    })();
  </script>
</body>
</html>
