<!DOCTYPE html>
<!-- Fixture for the gauge's anchoring in claude.ai's current composer. Not
     shipped.

     test/gauge.html models the composer as it was: a flex row with the mic
     and send as direct children. The current one is shaped differently, and
     every difference is one that broke the gauge:

       - Both control clusters are absolutely positioned over the bottom of
         the editor card, and the right-hand cluster is pointer-events: none
         (only its buttons opt back in). A gauge inserted into it inherited
         that and could not be clicked.
       - Dictation is a split button — the mic and a microphone-picker chevron
         in one rounded outline — and the mic button sits inside it behind two
         `display: contents` segment wrappers. Anchoring beside the button put
         the gauge inside the split, between its halves.
       - The split sits in a stack of single-child cells in a grid that
         overlays it with whatever replaces it; send and voice mode share
         another grid cell the same way.

     The DOM below is that structure, reduced to the elements and the layout
     properties that matter, with the class names the page uses where they
     are what usage.js keys on. Open it and read #out. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>composer anchoring fixture</title>
<link rel="stylesheet" href="../content/usage.css">
<style>
  html { color-scheme: dark; }
  body { margin: 0; background: #191919; color: #ffffffed; font: 14px system-ui; }
  main { max-width: 560px; margin: 40vh auto 0; padding: 0 16px; }
  .card { position: relative; background: #1f1f1f; border-radius: 20px; padding: 8px; }
  .editor-wrap { padding-bottom: 36px; }
  .editor { min-height: 28px; padding: 4px 8px; outline: none; }
  .lead { position: absolute; bottom: 8px; left: 8px; display: flex; align-items: center; }
  .trail { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 8px; pointer-events: none; }
  .trail button { pointer-events: auto; }
  .flex { display: flex; align-items: center; }
  .gap-2 { gap: 8px; justify-content: flex-end; }
  .grid { display: grid; align-items: center; justify-items: end; }
  .cell { grid-column-start: 1; grid-row-start: 1; display: flex; align-items: center; }
  .contents { display: contents; }
  .split { position: relative; display: inline-flex; align-items: stretch; border-radius: 8px; }
  .divider { width: 1px; align-self: stretch; background: #ffffff1a; }
  button { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px;
           background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.chev { width: 14px; }
  #out { white-space: pre; font: 12px ui-monospace, monospace; padding: 16px; }
</style>
</head>
<body>
  <main>
    <div class="card" id="card">
      <div class="editor-wrap">
        <div class="editor" contenteditable="true" data-testid="chat-input">Type / for skills</div>
      </div>
      <div class="lead">
        <button data-testid="chat-input-attach" aria-label="Add files, connectors, and more">+</button>
      </div>
      <div class="trail" id="trail">
        <div class="flex gap-2" id="dictateCluster">
          <div class="grid">
            <div class="cell">
              <div class="flex" id="composer-dictate">
                <div class="split group/split" aria-label="Dictate">
                  <div class="contents" data-cds-segment><div class="contents">
                    <button aria-label="Dictate" id="mic">◉</button>
                  </div></div>
                  <span class="divider"></span>
                  <div class="contents" data-cds-segment>
                    <button class="chev" aria-label="Microphone">⌄</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="grid" id="sendCell">
          <div class="cell"><button aria-label="Use voice mode" id="voice">⦀</button></div>
        </div>
      </div>
    </div>
  </main>
  <div id="out">running…</div>

  <script>
    // Same stub as gauge.html: just enough bridge for usage.js to mount.
    globalThis.__handlers = {};
    globalThis.Thistle = {
      injectBridgeOnce: () => Promise.resolve(true),
      bridge: {
        on(name, fn) {
          (globalThis.__handlers[name] = globalThis.__handlers[name] || []).push(fn);
        },
        requestUsage: () => Promise.resolve(null),
      },
    };
    globalThis.__emit = function (name, payload) {
      for (const fn of globalThis.__handlers[name] || []) fn(payload);
    };
  </script>
  <script src="../content/usage.js"></script>
  <script>
    (async function () {
      const settle = () => new Promise((r) => setTimeout(r, 200));
      const bar = () => document.querySelector(".th-usage");
      const results = [];
      async function check(name, fn) {
        let ok = false;
        try { ok = !!(await fn()); } catch (e) { ok = false; }
        results.push((ok ? "PASS  " : "FAIL  ") + name);
      }

      await settle();
      __emit("th:limit", { windows: { "5h": { utilization: 0.42, resets_at: Date.now() / 1000 + 7200 } } });
      await settle();

      await check("mounted", () => !!bar());
      await check("not inside the split button", () => !bar().closest(".split"));
      await check("not inside a stacked grid cell", () => !bar().closest(".grid"));
      await check("immediately before the dictation cluster", () =>
        bar().nextElementSibling === document.getElementById("dictateCluster"));
      await check("in the trailing toolbar", () => bar().parentElement.id === "trail");
      await check("left of the mic, on its line", () => {
        const g = bar().getBoundingClientRect();
        const m = document.getElementById("mic").getBoundingClientRect();
        return g.right <= m.left && Math.abs(g.top + g.height / 2 - (m.top + m.height / 2)) <= 1;
      });
      await check("takes clicks despite the cluster's pointer-events: none", () => {
        const g = bar().getBoundingClientRect();
        const hit = document.elementFromPoint(g.left + g.width / 2, g.top + g.height / 2);
        return getComputedStyle(bar()).pointerEvents === "auto" && !!hit && bar().contains(hit);
      });
      await check("click opens the panel", async () => {
        bar().click();
        await settle();
        return document.querySelector(".th-usage__popover").hasAttribute("data-open");
      });
      await check("Escape closes it", async () => {
        document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await settle();
        return !document.querySelector(".th-usage__popover").hasAttribute("data-open");
      });
      await check("Enter on the focused gauge opens it", async () => {
        bar().focus();
        bar().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        await settle();
        const open = document.querySelector(".th-usage__popover").hasAttribute("data-open");
        const expanded = bar().getAttribute("aria-expanded") === "true";
        document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        return open && expanded;
      });
      await check("typing (mic unmounts) → holds its place", async () => {
        const before = bar().getBoundingClientRect();
        document.getElementById("composer-dictate").remove();
        await settle();
        const now = bar().getBoundingClientRect();
        return bar().parentElement.id === "trail" && Math.abs(now.top - before.top) <= 1;
      });

      /* A trailing toolbar holding the mic and nothing else. With no
         neighbour anywhere on the way up, the climb used to run all the way to
         the card and insert there in block flow — drawing the ring over the
         [+] (seen on Claude Code on the web). Rebuilt in place, as a flex
         toolbar and as a plain block one, with the gauge taken out first so
         it re-mounts against the new shape. */
      const attach = document.querySelector('[data-testid="chat-input-attach"]');
      const overlaps = (a, b) =>
        a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
      // A background tab throttles timers well past settle(), so wait for it.
      async function until(test) {
        for (let i = 0; i < 30 && !test(); i += 1) await settle();
      }

      async function loneMic(display) {
        const gauge = bar();
        gauge.remove();
        const trail = document.getElementById("trail");
        trail.replaceChildren();
        trail.style.display = display;
        const wrap = document.createElement("div");
        if (display === "flex") wrap.className = "flex";
        const mic = document.createElement("button");
        mic.id = "loneMic";
        mic.setAttribute("aria-label", "Dictate");
        mic.textContent = "◉";
        wrap.append(mic);
        trail.append(wrap);
        await until(() => gauge.isConnected);
      }

      for (const display of ["flex", "block"]) {
        await check("lone mic (" + display + " toolbar) → mounted in the toolbar", async () => {
          await loneMic(display);
          return document.getElementById("trail").contains(bar());
        });
        await check("lone mic (" + display + " toolbar) → not over the [+]", () =>
          !overlaps(bar().getBoundingClientRect(), attach.getBoundingClientRect()));
        await check("lone mic (" + display + " toolbar) → left of the mic, on its line", () => {
          const g = bar().getBoundingClientRect();
          const m = document.getElementById("loneMic").getBoundingClientRect();
          return g.right <= m.left + 1 && Math.abs(g.top + g.height / 2 - (m.top + m.height / 2)) <= 2;
        });
      }

      await check("never mounted directly in the card", () => bar().parentElement.id !== "card");

      /* Claude Code on the web has its own ring, so the gauge stands down on
         /code — and that is a client-side route, so it has to notice the
         change without a page load. The mutation is what a route change
         brings with it. */
      const home = location.pathname + location.search;
      await check("on /code → removed", async () => {
        history.pushState(null, "", "/code/session");
        document.getElementById("card").append(document.createElement("span"));
        await until(() => !bar());
        return !bar();
      });
      await check("back from /code → mounted again", async () => {
        history.pushState(null, "", home);
        document.getElementById("card").append(document.createElement("span"));
        await until(() => !!bar());
        return !!bar() && document.getElementById("trail").contains(bar());
      });

      /* The footer line under the card, nested as claude.ai nests it: a line
         holding a leading group (the tools, then a stretching gap the
         disclaimer sits in) and a right-hand wrapper around the cluster of
         the model picker (wrapped twice) and "Auto". The cluster is where
         Claude Code puts its ring, and it outranks every composer position.
         Everything else on the line is left exactly as Claude draws it. */
      const foot = document.createElement("div");
      foot.className = "flex";
      foot.id = "footLine";
      foot.style.cssText = "gap: 8px; margin-top: 8px; font-size: 13px;";
      foot.innerHTML =
        '<div class="flex" id="footLead" style="flex: 1 1 0; min-width: 0; gap: 4px">' +
        '<div class="flex" id="footTools"><button aria-label="Dictate" id="footMic">◉</button></div>' +
        '<span id="disclaimer" style="flex: 1 1 0; text-align: center">Claude is AI and can make mistakes.</span>' +
        "</div>" +
        '<div class="flex" id="footRight" style="flex-shrink: 0">' +
        '<div class="flex" id="chinEnd" style="gap: 2px; margin-left: auto">' +
        '<div class="flex" id="modelItem"><span style="display: inline-flex">' +
        '<button data-testid="model-selector-dropdown" aria-haspopup="menu" style="width: auto; padding: 0 6px">Sonnet 5.5 Medium</button>' +
        "</span></div>" +
        '<div class="grid" id="autoItem"><span style="display: inline-flex; padding: 0 8px" id="auto">Auto</span></div>' +
        "</div></div>";
      document.querySelector("main").style.maxWidth = "900px";
      document.querySelector("main").append(foot);
      const box = (id) => document.getElementById(id).getBoundingClientRect();
      const sameLine = (a, b) => Math.abs(a.top + a.height / 2 - (b.top + b.height / 2)) <= 1;

      await check("footer → ends the picker's cluster", async () => {
        await until(() => !!bar() && bar().parentElement && bar().parentElement.id === "chinEnd");
        return bar().parentElement.id === "chinEnd" && bar() === bar().parentElement.lastElementChild;
      });
      /* The line stays as Claude draws it. Moving "Auto" left (as Claude Code
         lays its line out) was tried two ways and both pulled the centred
         disclaimer off-centre, so nothing but the gauge is added. */
      await check("footer → Auto stays where Claude put it, after the model", () => {
        const a = box("auto"), m = box("modelItem"), g = bar().getBoundingClientRect();
        return a.left >= m.right - 1 && g.left >= a.right - 1 && sameLine(a, m);
      });
      await check("footer → nothing on the line is marked or reshaped", () => {
        const lead = box("footLead"), right = box("footRight"), line = box("footLine");
        const marked = document.querySelector("#footLine [data-th-flat], #footLine [data-th-order], #footLine [style*='--th-shift']");
        return !marked && lead.width > 0 && Math.abs(lead.width + right.width + 8 - line.width) <= 1;
      });
      await check("footer → nothing re-parented in Claude's DOM", () => {
        return document.getElementById("autoItem").parentElement.id === "chinEnd" &&
          document.getElementById("modelItem").parentElement.id === "chinEnd" &&
          document.getElementById("chinEnd").parentElement.id === "footRight";
      });
      await check("footer → still clickable", () => {
        const g = bar().getBoundingClientRect();
        const hit = document.elementFromPoint(g.left + g.width / 2, g.top + g.height / 2);
        return !!hit && bar().contains(hit);
      });
      await check("footer → hidden on /code, back on return", async () => {
        history.pushState(null, "", "/code/session");
        document.getElementById("card").append(document.createElement("span"));
        await until(() => !bar());
        const gone = !bar();
        history.pushState(null, "", home);
        document.getElementById("card").append(document.createElement("span"));
        await until(() => !!bar());
        return gone && bar().parentElement.id === "chinEnd" && bar() === bar().parentElement.lastElementChild;
      });
      await check("footer → Claude re-rendering Auto leaves the gauge last", async () => {
        const fresh = document.getElementById("autoItem").cloneNode(true);
        document.getElementById("autoItem").replaceWith(fresh);
        await settle();
        await until(() => bar().parentElement.lastElementChild === bar());
        return bar().parentElement.id === "chinEnd" && bar().parentElement.lastElementChild === bar();
      });

      /* The same footer, with the disclaimer where claude.ai may well keep it:
         absolutely positioned, centred on the line, inside a wrapper that is
         position: relative. display: contents gives that wrapper no box, so
         an absolute child of it is re-anchored to the next positioned
         ancestor up — and the disclaimer jumps off the line to wherever
         that is (above the composer, on a real page). The rearrangement has
         to see that and leave such a layout alone. */
      document.getElementById("footLine").remove();
      const foot2 = document.createElement("div");
      foot2.className = "flex";
      foot2.id = "footLine2";
      foot2.style.cssText = "gap: 8px; margin-top: 8px; font-size: 13px";
      /* The next positioned ancestor up, as on the real page: far from the
         line, so an anchor lost to display: contents lands somewhere obvious. */
      document.querySelector("main").style.position = "relative";
      foot2.innerHTML =
        '<div class="flex" id="footLead2" style="flex: 1 1 0; min-width: 0; gap: 4px; position: relative; height: 28px">' +
        '<button aria-label="Dictate">◉</button>' +
        '<span id="disclaimer2" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">Claude is AI and can make mistakes.</span>' +
        "</div>" +
        '<div class="flex" id="footRight2" style="flex-shrink: 0">' +
        '<div class="flex" id="chinEnd2" style="gap: 2px">' +
        '<div class="flex" id="modelItem2"><span style="display: inline-flex">' +
        '<button data-testid="model-selector-dropdown" aria-haspopup="menu" style="width: auto; padding: 0 6px">Sonnet 5.5 Medium</button>' +
        "</span></div>" +
        '<div class="grid" id="autoItem2"><span style="display: inline-flex; padding: 0 8px" id="auto2">Auto</span></div>' +
        "</div></div>";
      document.querySelector("main").append(foot2);
      const r2 = (id) => document.getElementById(id).getBoundingClientRect();

      await check("positioned disclaimer → gauge still ends the picker's cluster", async () => {
        await until(() => !!bar() && bar().parentElement && bar().parentElement.id === "chinEnd2");
        return !!bar() && bar().parentElement.id === "chinEnd2";
      });
      await check("positioned disclaimer → stays on its line", async () => {
        await settle();
        await settle();
        const d = r2("disclaimer2");
        const line = r2("footLine2");
        return d.top >= line.top - 1 && d.bottom <= line.bottom + 1;
      });
      await check("positioned disclaimer → still inside its own slot, left of the model", () => {
        const d = r2("disclaimer2");
        const slot = r2("footLead2");
        return d.left >= slot.left - 1 && d.right <= slot.right + 1 && d.right <= r2("modelItem2").left + 1;
      });
      await check("positioned disclaimer → nothing flattened that would unhook it", () => {
        return !document.getElementById("footLead2").hasAttribute("data-th-flat");
      });

      const fail = results.filter((r) => r.startsWith("FAIL")).length;
      document.getElementById("out").textContent =
        (fail ? fail + " FAILED, " : "") + (results.length - fail) + " passed\n\n" + results.join("\n");
    })();
  </script>
</body>
</html>
