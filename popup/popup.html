<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Thistle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <!-- The gauge from icons/, redrawn as a stroke so it takes the clay from
         CSS. Inline SVG rather than an <img> of the PNG so it stays crisp at
         any zoom. -->
    <svg class="top__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5.6 18.4A9 9 0 1 1 18.4 18.4" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2.1" fill="currentColor"/>
    </svg>
    <h1>Thistle</h1>
    <!-- Whether there is a claude.ai tab to act on — the one piece of state
         the whole panel depends on. -->
    <span class="dot" id="statusDot" data-off title="No claude.ai tab"></span>
  </header>

  <!-- Usage. The same ring as the in-page gauge — r=8 in a 20x20 box, sweep
       driven by stroke-dashoffset from twelve o'clock — drawn large, with the
       figure inside it. popup.js pins the dasharray to the circumference. -->
  <section class="usage" id="usageStatus" data-needs-tab>
    <div class="usage__dial">
      <svg class="usage__ring" viewBox="0 0 20 20" aria-hidden="true">
        <circle class="usage__ring-track" cx="10" cy="10" r="8"/>
        <circle class="usage__ring-fill" id="usageRing" cx="10" cy="10" r="8"/>
      </svg>
      <span class="usage__pct" id="usagePct">—</span>
    </div>
    <div class="usage__body">
      <p class="usage__label">Current session</p>
      <p class="usage__reset" id="usageReset">Waiting for Claude</p>
    </div>
  </section>

  <div class="weekly" id="weeklyRow" hidden>
    <span class="weekly__label">Weekly</span>
    <span class="weekly__meter"><span class="weekly__fill" id="weeklyFill"></span></span>
    <span class="weekly__pct" id="weeklyPct"></span>
  </div>

  <main class="stack">
    <section class="group" data-needs-tab>
      <div class="group__head">
        <p class="label">Conversation</p>
        <p class="hint" id="contextHint"></p>
      </div>
      <!-- Menu rows rather than chips: an icon, a label, and the target on
           the right — the shape of Claude's own menus. -->
      <button class="row" data-copy="markdown" title="Copy the whole conversation to the clipboard as Markdown">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="8.5" y="8.5" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M15.5 5.2A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7a2.5 2.5 0 0 0 1.7 2.4"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span class="row__label">Copy as Markdown</span>
        <span class="row__meta">Clipboard</span>
      </button>
      <button class="row" data-download="markdown" title="Save the whole conversation as a .md file">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3.5v11m0 0 4-4m-4 4-4-4" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16.5v2A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-2"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span class="row__label">Download</span>
        <span class="row__meta">.md</span>
      </button>
    </section>

    <section class="group" data-needs-tab>
      <div class="group__head">
        <p class="label">Continue in</p>
      </div>
      <div class="targets">
        <button class="target" data-transfer="chatgpt" style="--brand: #10a37f"
                title="Open ChatGPT with this conversation in the composer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M22.28 9.82a5.98 5.98 0 0 0-.52-4.91 6.05 6.05 0 0 0-6.51-2.9A6.07 6.07 0 0 0 4.98 4.18a5.98 5.98 0 0 0-4 2.9 6.05 6.05 0 0 0 .75 7.1 5.98 5.98 0 0 0 .51 4.91 6.05 6.05 0 0 0 6.51 2.9A5.98 5.98 0 0 0 13.26 24a6.06 6.06 0 0 0 5.77-4.21 5.99 5.99 0 0 0 4-2.9 6.06 6.06 0 0 0-.75-7.07Zm-9.02 12.61a4.48 4.48 0 0 1-2.88-1.04l.14-.08 4.78-2.76a.79.79 0 0 0 .4-.68v-6.74l2.02 1.17a.07.07 0 0 1 .04.05v5.59a4.5 4.5 0 0 1-4.5 4.49Zm-9.66-4.13a4.47 4.47 0 0 1-.53-3.01l.14.08 4.78 2.76a.77.77 0 0 0 .78 0l5.84-3.37v2.34a.08.08 0 0 1-.03.06L9.74 19.95a4.5 4.5 0 0 1-6.14-1.65ZM2.34 7.9a4.49 4.49 0 0 1 2.37-1.98v5.68a.77.77 0 0 0 .39.68l5.81 3.35-2.02 1.17a.08.08 0 0 1-.07 0l-4.83-2.79A4.5 4.5 0 0 1 2.34 7.9Zm16.6 3.86-5.84-3.4 2.02-1.16a.08.08 0 0 1 .07 0l4.83 2.79a4.49 4.49 0 0 1-.68 8.1v-5.67a.79.79 0 0 0-.4-.67Zm2.01-3.03-.14-.08-4.77-2.78a.78.78 0 0 0-.79 0L9.41 9.23V6.9a.07.07 0 0 1 .03-.06l4.83-2.79a4.5 4.5 0 0 1 6.68 4.66ZM8.31 12.86l-2.02-1.16a.08.08 0 0 1-.04-.06V6.07a4.5 4.5 0 0 1 7.38-3.45l-.14.08-4.78 2.76a.79.79 0 0 0-.4.68Zm1.1-2.36 2.6-1.5 2.61 1.5v3l-2.6 1.5-2.6-1.5Z"/>
          </svg>
          <span>ChatGPT</span>
        </button>
        <button class="target" data-transfer="gemini" style="--brand: #4c8df6"
                title="Open Gemini with this conversation in the composer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0c0 6.63 5.37 12 12 12-6.63 0-12 5.37-12 12 0-6.63-5.37-12-12-12C6.63 12 12 6.63 12 0Z"/>
          </svg>
          <span>Gemini</span>
        </button>
        <button class="target" data-transfer="grok" title="Open Grok with this conversation in the composer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2.6 3h4.13l6.3 8.9-2.07 2.93L2.6 3Zm0 18h4.13l2.9-4.13-2.07-2.94L2.6 21ZM21.4 3h-4.13L8.75 21h4.14L21.4 3Z"/>
          </svg>
          <span>Grok</span>
        </button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
