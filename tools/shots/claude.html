<!DOCTYPE html>
<!-- Stage for the website's screenshots. Not shipped.

     A Claude chat screen reduced to what the shots need — greeting, composer,
     the footer line — painted with claude.ai's dark --cds-* values, running
     the real content/usage.js and usage.css against a stubbed bridge. What
     the screenshots show is the gauge as it ships, placed by its own code.

     ?pct= sets the reading, ?open=1 opens the panel. tools/shots/capture.mjs
     drives it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude</title>
<link rel="stylesheet" href="../../content/usage.css">
<style>
  :root {
    color-scheme: dark;
    --cds-page-bg: #191919; --cds-surface-3: #262624; --cds-surface-popover: #303030;
    --cds-text-primary: #ffffffed; --cds-text-secondary: #ffffff91; --cds-text-muted: #ffffff66;
    --cds-border: #ffffff0a; --cds-border-line: #ffffff1f;
    --cds-fill-ghost-hover: #ffffff13; --cds-fill-ghost-selected: #ffffff26;
    --cds-fill-accent: #257de0; --cds-fill-warning: #fbb315; --cds-fill-danger: #dc3c3d;
    --cds-text-danger: #f17778; --cds-bg-danger: #dc3c3d1f;
    --cds-h-control: 28px; --cds-radius: 8px;
    --cds-shadow-lg: 0 4px 8px 0 rgba(11,11,11,.08), 0 12px 28px -2px rgba(0,0,0,.24);
    --cds-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #191919; color: #ffffffed; font: 15px/1.5 var(--cds-font-sans); }
  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hello { display: flex; align-items: center; gap: 14px; font: 400 38px/1.1 "Iowan Old Style", "Charter", Georgia, serif; letter-spacing: -0.01em; margin-bottom: 170px; }
  .spark { width: 34px; height: 34px; color: #d97757; }
  .dock { width: min(760px, calc(100vw - 48px)); }
  .card { position: relative; background: #2a2a28; border: 1px solid #ffffff14; border-radius: 20px; padding: 14px 14px 10px; box-shadow: 0 1px 0 #ffffff08 inset; }
  .editor { min-height: 48px; padding: 2px 6px; color: #ffffff66; outline: none; }
  .card-row { display: flex; justify-content: flex-end; }
  .send { width: 32px; height: 32px; border-radius: 10px; border: 0; background: #d97757; color: #fff; display: grid; place-items: center; }
  .send svg, .icon svg { width: 18px; height: 18px; }
  .foot { display: flex; align-items: center; gap: 8px; padding: 10px 6px 0; color: #ffffffb8; font-size: 14px; }
  .lead { display: flex; flex: 1 1 0; min-width: 0; align-items: center; gap: 2px; }
  .tools { display: flex; align-items: center; gap: 2px; }
  .spacer { flex: 1 1 0; min-width: 0; text-align: center; color: #ffffff66; font-size: 13px; white-space: nowrap; overflow: hidden; }
  .right { display: flex; flex-shrink: 0; }
  .cluster { display: flex; align-items: center; gap: 2px; }
  .icon, .pill { height: 28px; border: 0; background: transparent; color: inherit; font: inherit; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
  .icon { width: 28px; }
  .pill { padding: 0 8px; gap: 6px; }
  .pill b { font-weight: 500; color: #ffffffed; }
  .pill span { color: #ffffff91; }
</style>
</head>
<body>
  <div class="page">
    <div class="hello">
      <svg class="spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5l1.6 7.1 6.1-3.9-3.9 6.1 7.1 1.6-7.1 1.6 3.9 6.1-6.1-3.9L12 22.5l-1.6-7.1-6.1 3.9 3.9-6.1L1.1 11.6l7.1-1.6-3.9-6.1 6.1 3.9z"/></svg>
      <span>Evening, Nabil</span>
    </div>
    <div class="dock">
      <div class="card" id="card">
        <div class="editor" contenteditable="true" data-testid="chat-input">How can I help you today?</div>
        <div class="card-row">
          <button class="send" aria-label="Send message" data-testid="chat-input-send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="foot">
        <div class="lead">
          <div class="tools">
            <button class="icon" aria-label="Add files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="icon" aria-label="Dictate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
            <button class="icon" aria-label="Use voice mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></button>
          </div>
          <span class="spacer">Claude is AI and can make mistakes.</span>
        </div>
        <div class="right">
          <div class="cluster">
            <div><span style="display:inline-flex"><button class="pill" data-testid="model-selector-dropdown" aria-haspopup="menu"><b>Sonnet 5.5</b><span>Medium</span></button></span></div>
            <div><button class="pill"><b>Auto</b></button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    globalThis.__handlers = {};
    globalThis.Thistle = {
      injectBridgeOnce: () => Promise.resolve(true),
      bridge: {
        on(n, fn) { (globalThis.__handlers[n] = globalThis.__handlers[n] || []).push(fn); },
        requestUsage: () => Promise.resolve(null),
      },
    };
    globalThis.__emit = (n, p) => { for (const fn of globalThis.__handlers[n] || []) fn(p); };
  </script>
  <script src="../../content/usage.js"></script>
  <script>
    (async () => {
      const q = new URLSearchParams(location.search);
      const pct = Number(q.get("pct") || 42) / 100;
      const now = Date.now() / 1000;
      await new Promise((r) => setTimeout(r, 300));
      __emit("th:limit", { windows: {
        "5h": { utilization: pct, resets_at: now + 2 * 3600 + 14 * 60 },
        "7d": { utilization: 0.31, resets_at: now + 3 * 86400 + 5 * 3600 },
      } });
      await new Promise((r) => setTimeout(r, 400));
      if (q.get("open")) document.querySelector(".th-usage").click();
      document.documentElement.dataset.ready = "1";
    })();
  </script>
</body>
</html>
